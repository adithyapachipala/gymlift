function home(){const d0=new Date();d0.setHours(0,0,0,0);d0.setDate(d0.getDate()-(d0.getDay()+6)%7);const wk=S.workouts.filter(w=>w.start>=d0.getTime()).length,g=S.user.pw||3,lbl=wk<g?wk+' / '+g+' workouts':g+' / '+g+(wk===g?' · goal reached':' · +'+(wk-g)+' extra');let bars='';for(let i=0;i<g;i++)bars+=`<i class='${i<wk?'on':''}'></i>`;

function wtab(){let h=`<h1>Workout</h1>`+(S.active?`<button class='card' style='${CB}' data-a='resume'><b>Resume workout</b><div class='tip'>${esc(S.active.name)} is in progress</div></button>`:`<button class='btn alt' data-a='startE'>+ Start Empty Workout</button>`);
h+=`<h2>Routines</h2><div class='grid2'><button class='btn alt' data-a='newR'>New Routine</button><button class='btn alt' data-a='explore'>Explore</button></div>`;
if(!S.routines.length)h+=`<div class='empty'>No routines yet. See the programs picked for your goal in Explore, or create your own.</div>`;
S.routines.forEach(r=>{h+=`<div class='card' style='margin-top:12px'><div class='row between'><b>${esc(r.name)}</b><button data-a='rmenu' data-i='${r.id}'>&#8943;</button></div><div class='tip' style='${EL}'>${esc(r.ex.map(e=>e.n).join(', '))}</div><button class='btn' data-a='startR' data-i='${r.id}'>Start Routine</button></div>`});return h}
const score=p=>{const u=S.user,n=parseInt(p.d);let s=-Math.abs(n-(u.pw||3))*10;if(u.level==='Beginner'&&n<=4)s+=3;if(u.level==='Advanced'&&n>=5)s+=3;if(u.goal==='Gain Strength'&&/5x5|heavy/i.test(p.n+p.r.map(r=>r.n).join()))s+=3;if(u.goal==='Build Muscle'&&n>=4)s+=3;return s};
const pcard=(p,i)=>`<div class='card'><b>${p.n}</b><div class='tip'>${p.d}</div>${p.r.map(r=>`<div class='tip'><b>${r.n}:</b> ${r.e.map(x=>x.n).join(', ')}</div>`).join('')}${saved(p)?`<button class='btn alt' style='margin-top:8px' disabled>Saved &#10003;</button>`:`<button class='btn' style='margin-top:8px' data-a='saveP' data-i='${i}'>Save program</button>`}</div>`;
function explore(){const u=S.user,l=PG.map((p,i)=>[p,i]).sort((a,b)=>score(b[0])-score(a[0]));return`<button class='back' data-a='back'>&#8249;</button><h1>Explore programs</h1><p class='sub'>Matched to your goal (${esc(u.goal||'training')}), experience (${esc(u.level||'any')}) and ${u.pw||3} days a week.</p><h2>Recommended for you</h2>${l.slice(0,2).map(x=>pcard(x[0],x[1])).join('')}<h2>More programs</h2>${l.slice(2).map(x=>pcard(x[0],x[1])).join('')}`}
function editR(){const r=V.r;return`<div class='topbar'><button class='back' data-a='back'>&#8249;</button><b>${r.id?'Edit routine':'New routine'}</b><button class='btn' data-a='saveR'>Save</button></div><input class='txt' data-f='r.name' value='${esc(r.name)}' placeholder='Routine name'>`+r.ex.map((e,i)=>`<div class='card' style='margin-top:12px'><div class='row between'><b>${esc(e.n)}</b><button data-a='rdel' data-i='${i}'>&#10005;</button></div><div class='row' style='margin-top:8px'><input class='txt' inputmode='numeric' data-f='r.${i}.sets' value='${e.sets}'><span>sets</span><input class='txt' data-f='r.${i}.reps' value='${esc(e.reps)}' placeholder='reps'><span>reps</span></div></div>`).join('')+`<button class='btn alt' style='margin-top:12px' data-a='addexr'>+ Add Exercise</button>`}
function activeV(){const a=S.active;let h=`<div class='topbar'><button class='back' data-a='back'>&#8249;</button><b>Log Workout</b><button class='btn' data-a='finish'>Finish</button></div><input class='txt' data-f='an' value='${esc(a.name)}'><div class='stats3'><div><small>Duration</small><b id='dur'></b></div><div><small>Volume</small><b id='vol'></b></div><div><small>Sets</small><b id='sc'></b></div></div>`;
a.ex.forEach((e,i)=>{const pv=prev(e.n);let wi=0;
h+=`<div class='ex-head'><b data-a='exd' data-n='${esc(e.n)}'>${esc(e.n)}</b><button data-a='emenu' data-i='${i}'>&#8942;</button></div><button class='chip' data-a='erest' data-i='${i}'><svg viewBox='0 0 24 24' width='16' height='16' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='13' r='8'/><path d='M12 9v4l2.5 2M9.5 2.5h5'/></svg> Rest: ${e.rest?mmss(e.rest):'OFF'}</button><input class='txt' data-f='a.${i}.note' value='${esc(e.note)}' placeholder='Add a note'><table class='sets'><tr><th>SET</th><th>PREVIOUS</th><th>${U().toUpperCase()}</th><th>REPS</th><th></th></tr>`;
e.sets.forEach((s,j)=>{const q=s.w?null:pv[wi],lab=s.w?'W':wi+1;if(!s.w)wi++;
h+=`<tr class='${s.d?'done':''}'><td><button class='sn ${s.w?'w':''}' data-a='warm' data-i='${i}' data-j='${j}'>${lab}</button></td><td class='badge'>${q?fw(q.k)+' × '+q.r:'-'}</td><td><input inputmode='decimal' data-f='a.${i}.${j}.k' value='${s.k===''?'':fw(s.k)}' placeholder='${q?fw(q.k):0}'></td><td><input inputmode='numeric' data-f='a.${i}.${j}.r' value='${esc(s.r)}' placeholder='${esc(s.t)}'></td><td><button class='ck' data-a='chk' data-i='${i}' data-j='${j}'>&#10003;</button></td></tr>`});
h+=`</table><button class='btn alt' style='margin-top:8px' data-a='aset' data-i='${i}'>+ Add Set</button>`});
return h+`<button class='btn' style='margin:20px 0 10px' data-a='addex'>+ Add Exercise</button><button class='btn danger' data-a='discard'>Discard Workout</button>`}
const bwCard=()=>{const b=S.bw;return`<div class='card'><div class='row between'><div><span class='badge'>Body weight</span><h2 style='margin:4px 0 0'>${b.length?fw(b[b.length-1].k)+' '+U():'Not set'}</h2></div><button class='chip' data-a='bw'>${b.length?'Update':'Add weight'}</button></div>${b.length>1?chart(b.map(x=>({x:x.t,y:fw(x.k)})),'Body weight ('+U()+')'):''}</div>`};
function prof(){const m=V.m||'dur',ws=S.workouts.slice(-12),f={dur:w=>Math.round(w.dur/60),vol:w=>Math.round(fw(vol(w.ex))),rep:w=>sum(w.ex,s=>+s.r||0)}[m],lab={dur:'Minutes',vol:'Volume ('+U()+')',rep:'Reps'}[m],names={};
S.workouts.forEach(w=>w.ex.forEach(e=>{names[e.n]=(names[e.n]||0)+1}));
const list=Object.keys(names).sort((a,b)=>names[b]-names[a]).map(n=>`<button class='pick' data-a='exd' data-n='${esc(n)}'><span>${esc(n)}</span><span class='badge'>${names[n]} sessions</span></button>`).join('')||`<div class='empty'>Exercises you log will show up here.</div>`;
return`<div class='row between'><h1>${esc(S.user.name||'Profile')}</h1><button class='chip' data-a='settings'>Settings</button></div><div class='grid2'><div class='card'><span class='badge'>Workouts</span><h2 style='margin:4px 0 0'>${S.workouts.length}</h2></div><div class='card'><span class='badge'>Total volume</span><h2 style='margin:4px 0 0'>${fw(S.workouts.reduce((a,w)=>a+vol(w.ex),0))} ${U()}</h2></div></div>${bwCard()}<div class='pills'>${[['dur','Duration'],['vol','Volume'],['rep','Reps']].map(x=>`<button class='${m===x[0]?'on':''}' data-a='met' data-v='${x[0]}'>${x[1]}</button>`).join('')}</div>${chart(ws.map(w=>({x:w.start,y:f(w)})),lab)}<h2>Exercises</h2>${list}`}
function exv(){const n=V.n,m=V.m||'best',hs=hist(n),lab={best:'Heaviest weight',orm:'Est. one rep max',vol:'Best session volume'},pr=k=>fw(Math.max(0,...hs.map(x=>x[k])));
const mHtml = `<div class='ex-media'><video src='${esc(n)}.mp4' autoplay loop muted playsinline onerror="this.style.display='none'"></video><img src='${esc(n)}.gif' onerror="this.style.display='none'"></div>`;
return`<button class='back' data-a='back'>&#8249;</button><h1>${esc(n)}</h1>${mHtml}<div class='pills'>${Object.keys(lab).map(k=>`<button class='${m===k?'on':''}' data-a='met' data-v='${k}'>${lab[k]}</button>`).join('')}</div>${chart(hs.map(x=>({x:x.t,y:fw(x[m])})),lab[m]+' ('+U()+')')}<h2>Personal records</h2><div class='card'><div class='row between'><span>Heaviest weight</span><b>${pr('best')} ${U()}</b></div><div class='row between'><span>Est. one rep max</span><b>${pr('orm')} ${U()}</b></div><div class='row between'><span>Best session volume</span><b>${pr('vol')} ${U()}</b></div></div><h2>History</h2>${hs.slice().reverse().map(x=>`<div class='card'><b>${dt(x.t)}</b><div class='tip'>${x.sets.filter(s=>s.d&&!s.w).map(s=>fw(s.k)+' × '+s.r).join(' · ')}</div></div>`).join('')||`<div class='empty'>No history yet.</div>`}`}
function wdet(){const w=S.workouts.find(x=>x.id===V.id);if(!w)return`<button class='back' data-a='back'>&#8249;</button>`;
return`<button class='back' data-a='back'>&#8249;</button><h1>${esc(w.name)}</h1><p class='sub'>${dt(w.start)} · ${dur(w.dur)} · ${fw(vol(w.ex))} ${U()}</p>${w.ex.map(e=>`<b data-a='exd' data-n='${esc(e.n)}' style='display:block;margin-top:14px;color:var(--ac)'>${esc(e.n)}</b>${e.note?`<div class='tip'>${esc(e.note)}</div>`:''}<div class='tip'>${e.sets.map(s=>(s.w?'W ':'')+fw(s.k)+' × '+s.r).join(' · ')}</div>`).join('')}<button class='btn alt' style='margin:20px 0 10px' data-a='hsave' data-i='${w.id}'>Save as routine</button><button class='btn danger' data-a='hdel' data-i='${w.id}'>Delete workout</button>`}
const settingsS=()=>sheet(`<b>Settings</b><h2>Weight units</h2>${seg('u.unit',['kg','lbs'],U())}<button class='menu-item' style='color:var(--bad)' data-a='reset'>Erase all data</button><button class='btn alt' style='margin-top:12px' data-a='sx'>Close</button>`);
const plist=()=>{const q=(V.pq||'').toLowerCase(),g=V.pg,l=[...EX,...S.custom].filter(x=>(!g||x[1]===g)&&x[0].toLowerCase().includes(q));let h=l.map(x=>`<button class='pick' data-a='pk' data-v='${esc(x[0])}'><span>${esc(x[0])}</span><span class='badge'>${x[1]}</span></button>`).join('');if(q&&!l.some(x=>x[0].toLowerCase()===q))h+=`<button class='pick' data-a='cu' data-v='${esc(V.pq)}'><span>+ Create “${esc(V.pq)}”</span></button>`;return h||`<div class='empty'>No matches</div>`};
const pickS=()=>sheet(`<div class='row between'><b>Add exercise</b><button data-a='sx'>Close</button></div><input class='txt' style='margin:10px 0' data-f='pq' placeholder='Search exercises' value='${esc(V.pq)}'><div class='pills'>${['All',...GR].map(g=>`<button class='${(V.pg||'All')===g?'on':''}' data-a='pg' data-v='${g}'>${g}</button>`).join('')}</div><div id='plist'>${plist()}</div>`);
const openPick=m=>{V.pm=m;V.pq='';V.pg='';pickS()};
const addEx=n=>{if(V.pm==='w')S.active.ex.push(mkEx(n,3,''));else V.r.ex.push({n,sets:3,reps:'10'});closeS();save();render()};
function setk(k,v){const[p,f]=k.split('.'),o=p==='o'?V.o:S.user;o[f]=f==='pw'?+v:v;save();render();if(p==='u'&&!$('#sheet').classList.contains('hidden'))settingsS()}
function stats(){const a=S.active,v=$('#vol'),c=$('#sc');if(!a)return;if(v)v.textContent=fw(vol(a.ex))+' '+U();if(c)c.textContent=sum(a.ex,()=>1)}
function tick(){const n=Date.now(),b=$('#restBar');if(restEnd){const l=(restEnd-n)/1e3;if(l<=0){restEnd=0;b.classList.add('hidden')}else{const r=$('#rt');if(r)r.textContent=mmss(l)}}if(S.active){const d=$('#dur');if(d)d.textContent=dur((n-S.active.start)/1e3)}}
function rest(sec){if(!sec)return;restEnd=Date.now()+sec*1e3;const b=$('#restBar');b.innerHTML=`<span>Rest <b id='rt'></b></span><span><button data-a='radd' data-v='-15'>-15s</button><button data-a='radd' data-v='15'>+15s</button><button data-a='rskip'>Skip</button></span>`;b.classList.remove('hidden');tick()}
function startW(name,l){if(S.active){toast('Finish or discard the current workout first');return}S.active={name,start:Date.now(),ex:l.map(e=>mkEx(e.n,e.sets,e.reps))};save();nav({s:'active'})}
function finish(){const a=S.active,ex=a.ex.map(e=>({n:e.n,rest:e.rest,note:e.note,sets:e.sets.filter(s=>s.d).map(s=>({k:+s.k||0,r:+s.r||0,w:s.w,d:1}))})).filter(e=>e.sets.length);if(!ex.length)return toast('Complete at least one set first');S.workouts.push({id:uid(),name:a.name||wname(),start:a.start,dur:Math.round((Date.now()-a.start)/1e3),ex});S.active=null;restEnd=0;$('#restBar').classList.add('hidden');save();V={t:'home'};render();toast('Workout saved')}
function render(){let h,hide=false;if(!S.user.done){h=onb();hide=true}else if(V.s==='active'){h=activeV();hide=true}else if(V.s==='edit'){h=editR();hide=true}else if(V.s==='explore')h=explore();else if(V.s==='ex')h=exv();else if(V.s==='hist')h=wdet();else h={home,workout:wtab,profile:prof}[V.t]();
$('#app').innerHTML=h;$('#tabbar').classList.toggle('hidden',hide);document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===V.t));stats();tick()}
